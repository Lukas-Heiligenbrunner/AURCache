[package]
name = "aurcache-db"
edition = "2024"

[lints]
workspace = true

[dependencies]
aurcache-common = { path = "../aurcache-common" }
anyhow = {workspace = true}
flate2 = {workspace = true}
tar = {workspace = true}
tracing = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
sea-orm = {workspace = true}

aurcache-deps = {path = "../aurcache-deps"}
pacman-mirrors = {path = "../pacman-mirrors"}

sea-orm-migration = {version = "2.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"]}

[dev-dependencies]
tempfile = {workspace = true}
tokio = { workspace = true, features = ["macros", "rt"] }
