[package]
name = "aurcache-worker-kube"
version = "0.1.0"
edition = "2024"

# The Kubernetes worker: a dispatcher that builds each job in a pod of its own,
# at Pod Security `baseline`, and streams the packages from the pod to the
# server without storing them.

[lints]
workspace = true

[dependencies]
# The oldest API version k8s-openapi offers, so the types cover every cluster
# from it on.
k8s-openapi = { version = "0.29.0", features = ["v1_33"] }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
aurcache-common = { path = "../aurcache-common" }
aurcache-worker-core = { path = "../aurcache-worker-core" }
aurcache-worker-container = { path = "../aurcache-worker-container" }
aurcache-build-agent = { path = "../aurcache-build-agent" }

[dev-dependencies]
tempfile = { workspace = true }
