[package]
name = "aurcache-sandbox"
version = "0.6.0"
edition = "2024"

# Deliberately standalone: the patched makechrootpkg and the server exec it
# rather than linking it, so it stays auditable on its own and has no
# dependency on worker or server internals.

[[bin]]
name = "aurcache-sandbox"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
landlock = "0.4"
libc = "0.2"
