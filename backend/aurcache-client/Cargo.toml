[package]
name = "aurcache-client"
version = "0.6.0"
edition = "2024"
description = "Typed async client for the AURCache HTTP API"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# Shared API shapes. The workspace entry takes them without default features,
# which keeps sea-orm out, so this crate — and the wasm frontend that uses it —
# stay driver-free.
aurcache-common = { workspace = true }
anyhow = { workspace = true }
# Zero-copy uploads: `restore` takes `Bytes` straight into the request body.
bytes = "1.12.2"
reqwest = { workspace = true, features = ["json", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# Pinning the query strings the list helpers send.
serde_urlencoded = "0.7.1"
