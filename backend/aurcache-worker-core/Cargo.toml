[package]
name = "aurcache-worker-core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
rcgen = { version = "0.14", features = ["pem"] }
flate2 = { workspace = true }
tar = { workspace = true }
percent-encoding = "2.3"
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
aurcache-common = { path = "../aurcache-common" }
# Fingerprints, shared with the server so the two
# cannot compute an identity differently.
aurcache-ca = { path = "../aurcache-ca" }
# `O_NOFOLLOW`, for opening what a build produced.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
