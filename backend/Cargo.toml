[workspace]
resolver = "2"
members = [
    "pacman-mirrors",
    "pacman-repo-utils",
    "aurcache",
    "aurcache-cli",
    "aurcache-client",
    "aurcache-deps",
    "aurcache-db",
    "aurcache-api",
    "aurcache-activitylog",
    "aurcache-utils",
    "aurcache-scheduler",
    "aurcache-common",
    "aurcache-ca",
    "aurcache-signing",
    "aurcache-worker",
    "aurcache-worker-core",
    "aurcache-worker-demo",
    "aurcache-worker-docker",
    "aurcache-worker-kube",
    "aurcache-worker-container",
    "aurcache-build-agent",
    "aurcache-sandbox",
    "aurcache-chroot"]

# The repository's LICENSE. Every crate inherits it, so a new one cannot
# forget it.
[workspace.package]
license = "MIT"
# Where the crates published to crates.io point back to.
repository = "https://github.com/Lukas-Heiligenbrunner/AURCache"
homepage = "https://lukas-heiligenbrunner.github.io/AURCache/"

# Idioms enforced across the workspace. Every lint here is at zero warnings, so
# these guard against regression rather than demanding a cleanup.
#
# To accommodate a specific site, suppress it locally there rather than dropping
# the lint from this list. A rule is left out below only when we object to it
# generally, not because of one awkward case.
#
# Pedantic/nursery lints deliberately not adopted:
#   map_unwrap_or        - map_or_else puts the fallback before the transform,
#                          inverting reading order.
#   redundant_pub_crate  - contradicts rustc's own unreachable_pub; pub(crate)
#                          in a private module documents intent.
#   option_if_let_else, single_match_else
#                        - point-free map_or is not clearer than an explicit
#                          if let / match.
#   assert_is_empty      - .is_empty() beats assert_eq!(x, "").
#   missing_errors_doc   - 137 sites; not a convention this project follows.
[workspace.lints.clippy]
use_self = "warn"
or_fun_call = "warn"
unnecessary_wraps = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
manual_is_variant_and = "warn"
redundant_clone = "warn"
assigning_clones = "warn"
needless_collect = "warn"
uninlined_format_args = "warn"
explicit_into_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
cloned_instead_of_copied = "warn"

[workspace.dependencies]
# Only aurcache-cli and aurcache-client take these; every other crate names its
# path. aurcache-common comes without its default features, so neither links a
# database driver. The two libraries share one version, and every release of
# them is a breaking bump (0.6 -> 0.7), so a requirement on the current version
# only ever matches the release it was built with. Releasing them bumps both
# `version` lines and these two requirements; aurcache-cli has its own version.
aurcache-common = { version = "0.6", path = "aurcache-common", default-features = false }
aurcache-client = { version = "0.6", path = "aurcache-client" }

tokio = "1.53.2"
anyhow = "1.0.104"
reqwest = "0.13.5"
tracing = "0.1.44"
jiff = "1.0.0"
serde = "1.0.229"
backon = "1.6.0"
serde_json = "1.0.154"
subtle = "2.6"
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-bigdecimal"] }
flate2 = "1.1.10"
tar = "0.4.46"
utoipa = { version = "6.0.0", features = ["rocket_extras"] }
tempfile = "3.27.0"
alpm-srcinfo = "0.7.0"
alpm-pkgbuild = "0.2.6"
diffy = "0.5"

[profile.release]
strip = "debuginfo"  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true  # Enable link-time optimization.
codegen-units = 1
