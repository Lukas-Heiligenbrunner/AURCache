[package]
name = "aurcache-worker-docker"
version = "0.6.0"
edition = "2024"
license.workspace = true

# The Docker worker: a container per build. Its own crate, so the chroot
# worker never links a Docker client.

[[bin]]
name = "aurcache-worker-docker"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
tracing = { workspace = true }
futures = "0.3"
bollard = "0.21"
aurcache-common = { path = "../aurcache-common" }
aurcache-worker-core = { path = "../aurcache-worker-core" }
