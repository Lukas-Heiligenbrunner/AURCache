[package]
name = "aurcache-worker-docker"
version = "0.6.0"
edition = "2024"
license.workspace = true
publish = false

# The Docker worker: a container per build, run by the build agent. Its own
# crate, so the chroot worker never links a Docker client.

[[bin]]
name = "aurcache-worker-docker"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
tracing = { workspace = true }
futures = "0.3"
bytes = "1.12.1"
tokio-util = { version = "0.7.20", features = ["io"] }
bollard = "0.21"
aurcache-common = { path = "../aurcache-common", features = ["beneath"] }
aurcache-worker-core = { path = "../aurcache-worker-core" }
aurcache-worker-container = { path = "../aurcache-worker-container" }
aurcache-build-agent = { path = "../aurcache-build-agent" }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
