[package]
name = "aurcache-activitylog"
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow = {workspace = true}
sea-orm = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
tracing = {workspace = true}
tokio = { workspace = true, features = ["sync", "rt", "macros"] }

aurcache-db = {path = "../aurcache-db"}
aurcache-common = {path = "../aurcache-common", features = ["db"]}

# todo utoipa should be removed to couple db from api fully
utoipa = { version = "6.0.0"}

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
sea-orm-migration = {version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-rustls"]}
pacman-mirrors = {path = "../pacman-mirrors"}
