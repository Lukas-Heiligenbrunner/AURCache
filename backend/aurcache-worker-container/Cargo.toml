[package]
name = "aurcache-worker-container"
version = "0.1.0"
edition = "2024"
publish = false

# The worker's side of a build the agent runs in a container: what the Docker
# worker and the Kubernetes worker share, and nothing either needs alone. Not
# part of aurcache-worker-core, so the chroot worker links none of it, and not
# part of the agent, which stays free of a worker's dependencies.

[lints]
workspace = true

[dependencies]
aurcache-common = { path = "../aurcache-common" }
aurcache-worker-core = { path = "../aurcache-worker-core" }
aurcache-build-agent = { path = "../aurcache-build-agent" }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
base64 = "0.22.1"
num-bigint = "0.4.8"
ring = "0.17.14"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = { workspace = true }
flate2 = { workspace = true }
