[package]
name = "aurcache-signing"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
aurcache-common = { path = "../aurcache-common", default-features = false, features = ["fs"] }
jiff = { workspace = true }
# Without its default `bzip2`: nothing here reads or writes compressed
# messages, and it would be the only C library the server links for OpenPGP.
pgp = { version = "0.21.1", default-features = false }
# The random number generator traits pgp's API takes are rand 0.8's.
rand = "0.10.4"

[dev-dependencies]
tempfile = { workspace = true }
