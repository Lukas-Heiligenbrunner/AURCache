[package]
name = "aurcache-cli"
version = "0.6.0"
edition = "2024"
description = "aurcli: command-line client for AURCache, the Arch Linux AUR build server and package repository"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["aur", "archlinux", "pacman", "build-server", "cli"]
categories = ["command-line-utilities"]

# Short binary name: the package keeps its name (so `cargo install` and
# `-p aurcache-cli` are unchanged), but the installed binary is `aurcli`.
[[bin]]
name = "aurcli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
aurcache-client = { workspace = true }
# Only the filesystem helpers on top of the types: the default `db` feature
# would link sea-orm, sqlx and a bundled SQLite the CLI never touches.
aurcache-common = { workspace = true, features = ["fs"] }
jiff = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
clap_complete = "4.6.12"
# Without the default `editor` prompt, which the CLI does not use and which
# brings tempfile along.
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
dirs = "7.0"
getrandom = "0.4.3"
unicode-width = "0.2.3"

[dev-dependencies]
wiremock = "0.6.5"
tempfile.workspace = true
# Only `YamlLoader` on UTF-8 text: the default `encoding` feature pins
# encoding_rs to one exact release, holding back the copy reqwest and multer
# share.
yaml-rust2 = { version = "0.13.2", default-features = false }
