[package]
name = "aurcache-cli"
edition = "2024"

# Short binary name: the package keeps its name (so `cargo install` and
# `-p aurcache-cli` are unchanged), but the installed binary is `aurcli`.
[[bin]]
name = "aurcli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
aurcache-client = { path = "../aurcache-client" }
aurcache-common = { path = "../aurcache-common" }
jiff = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6"
dialoguer = "0.12.0"
dirs = "7.0"
getrandom = "0.4"
unicode-width = "0.2"

[dev-dependencies]
tempfile.workspace = true
yaml-rust2 = "0.13.0"
