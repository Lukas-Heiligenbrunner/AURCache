[package]
name = "aurcache-build-agent"
version = "0.1.0"
edition = "2024"
publish = false

# The program that runs a build inside its container, and, as a library, the
# types of its interface with the workers that start it. It is linked
# statically and runs in images that are not the worker's, so it stays
# synchronous and small: no async runtime, no HTTP client, no TLS.

[lib]
path = "src/lib.rs"

[[bin]]
name = "aurcache-build-agent"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
# The types only: no database, filesystem or clock helpers.
aurcache-common = { path = "../aurcache-common", default-features = false, features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
