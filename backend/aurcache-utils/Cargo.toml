[package]
name = "aurcache-utils"
edition = "2024"
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Killing a parse's whole process group; see `pkgbuild::run_bounded`.
libc = "0.2.191"
# "https" enables the OpenSSL-backed HTTPS transport (required to clone AUR/git
# sources over https://); "ssh" the libssh2 one, for sources that only the
# server's SSH key can read; "vendored-openssl" builds OpenSSL from source so we don't
# depend on a system OpenSSL dev package being present (incl. for cross
# builds).
git2 = { version = "0.21.0", features = ["https", "ssh", "vendored-openssl"] }
# The server's SSH key and the known_hosts format, in Rust: the server image
# has no `ssh-keygen`.
ssh-key = { version = "0.6.7", features = ["ed25519", "getrandom"] }
# Matching the hashed host names that `ssh-keyscan -H` writes.
hmac = "0.13.0"
sha1 = "0.11.0"

anyhow = {workspace = true}
jiff = {workspace = true}
async-recursion = "1.2.0"
sea-orm = {workspace = true}
tokio = {workspace = true}
tracing = {workspace = true}

tempfile = {workspace = true}
flate2 = { workspace = true }
tar = { workspace = true }
alpm-srcinfo = {workspace = true}
alpm-pkgbuild = {workspace = true}
alpm-types = "0.14.0"
diffy = {workspace = true}
lru = "0.19.2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = "3.25.0"
# Comparing enrollment secrets in constant time.
subtle = {workspace = true}

aurcache-ca = {path = "../aurcache-ca"}
aurcache-signing = {path = "../aurcache-signing"}
aurcache-db = {path = "../aurcache-db"}
aurcache-deps = {path = "../aurcache-deps"}
aurcache-activitylog = {path = "../aurcache-activitylog"}
pacman-mirrors = {path = "../pacman-mirrors"}
pacman-repo-utils = {path = "../pacman-repo-utils"}
aurcache-common = {path = "../aurcache-common", features = ["digest"]}


[dev-dependencies]
aurcache-db = { path = "../aurcache-db", features = ["testing"] }
wiremock = "0.6.5"
zstd = "0.14.5"
sea-orm-migration = { version = "2.0.4", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
