[package]
name = "aurcache-utils"
edition = "2024"

[dependencies]
# "https" enables the OpenSSL-backed HTTPS transport (required to clone AUR/git
# sources over https://); "vendored-openssl" builds OpenSSL from source so we
# don't depend on a system OpenSSL dev package being present (incl. for cross
# builds).
git2 = { version = "0.21.0", features = ["https", "vendored-openssl"] }

anyhow = {workspace = true}
async-recursion = "1.1.1"
futures = "0.3.32"
sea-orm = {workspace = true}
tokio = {workspace = true}
tracing = {workspace = true}

tempfile = {workspace = true}
flate2 = { workspace = true }
tar = { workspace = true }
alpm-srcinfo = {workspace = true}
alpm-types = "0.11.2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = "3.11.0"

aurcache-db = {path = "../aurcache-db"}
aurcache-deps = {path = "../aurcache-deps"}
aurcache-activitylog = {path = "../aurcache-activitylog"}
pacman-mirrors = {path = "../pacman-mirrors"}
pacman-repo-utils = {path = "../pacman-repo-utils"}
aurcache-types = {path = "../aurcache-types"}


[dev-dependencies]
wiremock = "0.6"
sea-orm-migration = { version = "1.1.20", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
