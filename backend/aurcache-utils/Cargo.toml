[package]
name = "aurcache-utils"
edition = "2024"

[lints]
workspace = true

[dependencies]
# Killing a parse's whole process group; see `pkgbuild::run_bounded`.
libc = "0.2"
# "https" enables the OpenSSL-backed HTTPS transport (required to clone AUR/git
# sources over https://); "vendored-openssl" builds OpenSSL from source so we
# don't depend on a system OpenSSL dev package being present (incl. for cross
# builds).
git2 = { version = "0.21.0", features = ["https", "vendored-openssl"] }

anyhow = {workspace = true}
jiff = {workspace = true}
async-recursion = "1.2.0"
sea-orm = {workspace = true}
tokio = {workspace = true}
tracing = {workspace = true}

tempfile = {workspace = true}
flate2 = { workspace = true }
tar = { workspace = true }
alpm-srcinfo = {workspace = true}
alpm-pkgbuild = {workspace = true}
alpm-types = "0.12.0"
diffy = {workspace = true}
lru = "0.18"
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = "3.24.0"

aurcache-ca = {path = "../aurcache-ca"}
aurcache-db = {path = "../aurcache-db"}
aurcache-deps = {path = "../aurcache-deps"}
aurcache-activitylog = {path = "../aurcache-activitylog"}
pacman-mirrors = {path = "../pacman-mirrors"}
pacman-repo-utils = {path = "../pacman-repo-utils"}
aurcache-common = {path = "../aurcache-common"}


[dev-dependencies]
wiremock = "0.6"
zstd = "0.14"
sea-orm-migration = { version = "2.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls"] }
