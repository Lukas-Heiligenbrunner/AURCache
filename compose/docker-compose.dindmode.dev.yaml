services:
  aurcache:
    build:
        context: ..
        dockerfile: docker/server.Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - LOG_LEVEL=debug
      - TZ   # the schedule's timezone: the host's unless set (see docker-compose.yaml)
    volumes:
      - ../aurcache/db:/app/db
      - ../aurcache/repo:/app/repo
      - /etc/localtime:/etc/localtime:ro   # the host's timezone (see TZ above)
    privileged: true