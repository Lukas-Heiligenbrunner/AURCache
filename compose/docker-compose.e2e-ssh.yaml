# =============================================================================
# Overlay for the SSH-credential end-to-end test.
# =============================================================================
# Used together with docker-compose.e2e.yaml:
#
#   docker compose -f compose/docker-compose.e2e.yaml -f compose/docker-compose.e2e-ssh.yaml …
#
# Adds a throwaway git server and points the worker at a generated keypair.
# `SSH_TEST_KEYS` is a host directory holding `id_ed25519{,.pub}`, created per
# run by scripts/test-e2e-ssh.sh — no credential is committed or baked in.
#
# `WORKER_GIT_SSH_KEY` is set by the test rather than here: the first phase
# deliberately runs *without* it, to prove the fixture genuinely requires
# authentication and the test cannot pass for the wrong reason.
services:
  gitssh:
    build:
      context: ..
      dockerfile: docker/git-ssh.Dockerfile
    environment:
      - MARKER=${SSH_TEST_MARKER:-aurcache-ssh-credential-reached-the-chroot}
    volumes:
      - ${SSH_TEST_KEYS:?set SSH_TEST_KEYS to the generated keypair directory}:/keys:ro
    networks:
      - aurcache_network

  builder:
    depends_on:
      - aurcache
      - gitssh
    environment:
      - WORKER_GIT_SSH_KEY=${WORKER_GIT_SSH_KEY:-}
    volumes:
      - ${SSH_TEST_KEYS:?set SSH_TEST_KEYS to the generated keypair directory}:/keys:ro
