# =============================================================================
# AURCache — remote / foreign-architecture build worker (alternate topology)
# =============================================================================
# Run this on separate hardware (e.g. an aarch64 or armv7h machine) to add a
# native builder for that architecture to an AURCache server running elsewhere.
# Jobs for this worker's native arch are routed to it in preference to slow
# emulation on the main host.
#
# Unlike the bundled setup there is no shared `enroll` volume, so trust must be
# established explicitly. Two independent things:
#
#   1. Anti-MITM during enrollment — pin the server's CA fingerprint. Read it
#      from the server startup log line:
#          "Worker CA fingerprint (pin this on workers): <sha256>"
#      and set AURCACHE_SERVER_CA_FINGERPRINT below. Without a pin the worker
#      trusts-on-first-use, which is fine on a trusted network but not over the
#      public internet.
#
#   2. Approving THIS worker — pick ONE:
#      a) Pre-approve its cert fingerprint on the server (recommended). The
#         worker prints its fingerprint on first start; add it to the server's
#             AURCACHE_PREAPPROVED_WORKERS=<fingerprint>:arm-box:aarch64
#      b) Share an enrollment token: set the same value in the server's
#         AURCACHE_ENROLLMENT_TOKEN and this worker's AURCACHE_ENROLLMENT_TOKEN.
#      c) Just approve it once in the web UI (Workers page).
#
# Then:  docker compose -f compose/docker-compose.remote-worker.yaml up -d
# =============================================================================

services:
  builder:
    image: ghcr.io/lukas-heiligenbrunner/aurcache-worker:latest
    environment:
      - RUST_LOG=info
      # Public URL of the AURCache server's worker protocol port (HTTPS + mutual TLS).
      - AURCACHE_URL=https://aurcache.example.com:8083
      # Pin the server's CA (strongly recommended over the public internet).
      - AURCACHE_SERVER_CA_FINGERPRINT=REPLACE_WITH_SERVER_CA_SHA256
      # Native architecture(s) of this machine; foreign-arch jobs route here.
      - WORKER_ARCHES=aarch64
      # A starting point AURCache can change from this worker's page. The
      # plain WORKER_CONCURRENCY would pin it to this file instead.
      - WORKER_CONCURRENCY_DEFAULT=2
      # Where this worker fetches AURCache-built dependencies from, when that
      # is not simply the server's own address on the repository port. The
      # server sends one template to every worker and varies only the host, so
      # a worker that reaches the repository on a different port, scheme or
      # path -- through a reverse proxy, say -- has to say so here.
      # - AURCACHE_REPO_URL=https://aurcache.example.com/repo
      # Optional shared-secret enrollment (alternative to pre-approving the fp):
      # - AURCACHE_ENROLLMENT_TOKEN=your-shared-secret
      # A human-friendly name shown in the Workers UI (defaults to hostname).
      # - WORKER_NAME=arm-box
    volumes:
      - worker_data:/var/lib/aurcache-worker   # persisted base chroot
    privileged: true
    tmpfs:
      - /run
    restart: unless-stopped

volumes:
  worker_data:
