name: CI

# Branches in this repository get CI through their pull request: a push trigger
# on every branch ran each PR's jobs twice, once per event.
on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

jobs:
  lintAndTestRust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - name: Update local toolchain
        run: |
          rustup update
          rustup component add clippy
          rustup install stable          

      # `aurcache-api`'s `static` feature compiles the frontend to wasm inside
      # its build script, which needs the wasm target. The JS glue comes from a
      # build dependency, so nothing else is installed.
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Toolchain info
        run: |
          cargo --version --verbose
          rustc --version
          cargo clippy --version

      # The server parses a PKGBUILD by running this script through
      # aurcache-sandbox, both by absolute path (`aurcache-utils/src/pkgbuild.rs`).
      # Tests that parse one skip without them locally, and fail under CI, so
      # both paths are exported here. The runtime image installs the script the
      # same way - see docker/server.Dockerfile.
      - name: Install alpm-pkgbuild-bridge
        run: |
          curl -sSLf -o "$RUNNER_TEMP/alpm-pkgbuild-bridge" \
            "https://gitlab.archlinux.org/archlinux/alpm/alpm-pkgbuild-bridge/-/raw/main/alpm-pkgbuild-bridge.sh?ref_type=heads"
          sudo install -m 755 "$RUNNER_TEMP/alpm-pkgbuild-bridge" /usr/local/bin/alpm-pkgbuild-bridge
          echo "AURCACHE_PKGBUILD_BRIDGE=/usr/local/bin/alpm-pkgbuild-bridge" >> "$GITHUB_ENV"
          echo "AURCACHE_SANDBOX=$PWD/target/debug/aurcache-sandbox" >> "$GITHUB_ENV"

      # `aurcache-utils/tests/ssh_clone.rs` clones over SSH from a throwaway
      # `sshd` it runs as this user, and fails under CI rather than skip, so the
      # server is installed here. sshd refuses a locked account even for key
      # logins; `*` is "no password" without the lock.
      - name: Install sshd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo usermod -p '*' "$(id -un)"

      - name: Lint
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features static -p aurcache-api -- -D warnings

      - name: Test
        run: |
          cargo check
          # `cargo test` builds no plain binaries for a crate without
          # integration tests, and the PKGBUILD tests need this one.
          cargo build -p aurcache-sandbox
          cargo test --all
          # The app-shell fallback only exists under `static`, which is also
          # what mounts the asset handler, so its tests are invisible to the
          # run above.
          cargo test -p aurcache-api --features static

      # The run above is unprivileged, so it parses under Landlock alone -- a
      # native install. The container images run the server as root, and there
      # a parse runs as a separate user with Landlock layered on top where the
      # kernel has it. The same parse tests, as root: once as the images run on
      # this kernel, and once with Landlock off, as they run on a kernel
      # without it (Synology). See aurcache-sandbox/src/parse.rs.
      - name: Test PKGBUILD parsing as root
        run: |
          sudo useradd --system --no-create-home aurcache-parse
          source ../scripts/lib/common.sh
          tests=$(cargo_executable aurcache_utils test -p aurcache-utils --lib --no-run)
          cd aurcache-utils
          as_root() { sudo --preserve-env=AURCACHE_SANDBOX,AURCACHE_PKGBUILD_BRIDGE,CI env "$@"; }
          as_root "$tests" pkgbuild snapshot
          # Denying TCP is Landlock's, and hardening rather than part of the
          # profile, so a kernel without Landlock cannot be held to it.
          as_root AURCACHE_SANDBOX_DISABLE=landlock "$tests" pkgbuild snapshot \
            --skip a_parse_cannot_open_a_tcp_connection

      # The packages and images build a subset of the workspace at a time, not
      # all of it. Cargo unifies features across whatever is selected, and
      # `cargo test --all` also pulls in dev-dependencies -- so a crate can
      # under-declare a feature, compile fine here, and still fail in a
      # package build. Checking each exact invocation is what catches that.
      - name: Check package build shapes
        run: |
          # The PKGBUILDs under packaging/aurcache-*, one `cargo build` each
          # (docker/arch.Dockerfile builds the first four).
          cargo check -p aurcache-sandbox
          cargo check -p aurcache-worker
          cargo check --features aurcache-api/static -p aurcache
          cargo check -p aurcache-worker-docker
          cargo check -p aurcache-cli
          # The build agent, which packaging/common.sh builds alone beside the
          # Docker worker's package.
          cargo check -p aurcache-build-agent
          # docker/build-rust.sh (docker/server.Dockerfile)
          cargo check --features static

      # `aurcache-common` exists so a browser frontend can share the API shapes
      # without a database driver or the filesystem helpers. Every workspace
      # build turns the `db` and `fs` features on, so only an explicit
      # no-default-features check proves that still holds.
      - name: Check driver-free types
        run: |
          cargo check -p aurcache-common --no-default-features
          cargo check -p aurcache-client
          # The CLI and its client are installed on their own, where no server
          # crate turns `db` on for them, so neither may link a database driver.
          tree=$(cargo tree -p aurcache-cli -p aurcache-client -e normal --target all --prefix none)
          if grep -E '^(sea-orm|sqlx|libsqlite3-sys) ' <<<"$tree"; then
            echo "::error::aurcache-cli or aurcache-client links a database driver"
            exit 1
          fi

  # aurcache-common, aurcache-client and aurcache-cli are the crates meant for
  # crates.io (every other crate is `publish = false`). Packaging them and
  # building each from its own tarball, against the other two as packaged,
  # catches a file the build needs outside a crate directory or a path
  # dependency without a version. Nothing is uploaded.
  publishDryRun:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7

      - name: Update local toolchain
        run: rustup update

      - name: Package and verify the publishable crates
        run: cargo publish --dry-run --locked -p aurcache-common -p aurcache-client -p aurcache-cli

  # The frontend is its own workspace, built only for wasm32, so the backend
  # job above never lints or tests it. Both targets are linted, as `just lint`
  # does: the crate ships as wasm and its tests run on the host.
  lintAndTestFrontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-rs
    steps:
      - uses: actions/checkout@v7

      - name: Update local toolchain
        run: |
          rustup update
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown

      - name: Lint
        run: |
          cargo fmt -- --check
          cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
          cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # The unit tests render components directly, so they cannot see whether the
  # page boots; this opens every route in the runner's Chrome against a
  # seeded server with the frontend embedded. Offline routes only: `--online`
  # would make the run depend on the AUR being up.
  browserTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update local toolchain
        run: rustup update

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Render every route
        run: ./scripts/test-frontend.sh --shots "$RUNNER_TEMP/shots"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  # What `cargo test` leaves out because it needs root and a real kernel: the
  # worker's btrfs storage pool (loop devices, simple quotas) and its build
  # cgroups. They run as root in a privileged container on the runner's
  # kernel. The pool needs Linux 6.7+; on an older runner kernel the script
  # skips those tests with a warning annotation rather than failing.
  #
  # Not covered here: a pool on a real block device or zvol, and ZFS under an
  # image -- the runner has neither. `test-e2e.sh` builds in an image pool.
  kernelTests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update local toolchain
        run: rustup update

      - name: Pool and cgroup tests
        run: ./scripts/test-kernel.sh

  # A PKGBUILD runs outside the chroot while its sources are fetched; this
  # checks the Landlock confinement around that, both that it denies and that
  # the same fixture escapes without it. Docker only, on the runner's kernel.
  sandboxTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update local toolchain
        run: rustup update

      # Ubuntu takes the capabilities of a new user namespace away from a
      # process without CAP_SYS_ADMIN, as root in a build's container is, so
      # no build could mount in one there. The test checks that a build can,
      # as on a host that allows it; the key is absent elsewhere.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Sandbox test
        run: ./scripts/test-sandbox.sh

  # What pacman itself makes of what the server signs: an untrusted key is
  # refused, a trusted one installs with `SigLevel = Required`, and a database
  # or package that is not the one signed is refused. In an Arch container,
  # Docker only.
  signedRepoTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update local toolchain
        run: rustup update

      - name: Signed repository test
        run: ./scripts/test-signed-repo.sh

  # The build agent, statically linked as it ships, running builds in the
  # builder image under a build container's flags: a package builds, a
  # hostile PKGBUILD stays confined, and a killed build leaves nothing
  # running. Docker only. Its arm64 leg needs qemu, which this runner does
  # not register, so it is skipped here.
  buildAgentTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update local toolchain
        run: rustup update

      - name: Build agent test
        run: ./scripts/test-build-agent.sh

  # No e2e job here: the full suite builds images and hits the real AUR and
  # Arch mirrors, so it runs nightly (see e2e-nightly.yml) instead of on every
  # push -- and only when something landed since the last run.
