name: Build PR Docker Images

# Builds a pull request's server image for every architecture a release has,
# and keeps it as an artifact for docker-pr-publish.yml. See PR-IMAGES.md.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# A new push supersedes the build of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # packaging/ holds AUR submodules, which build-images.sh checks for.
          submodules: recursive
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # No registry login, secrets, or write token on this runner, and no
      # shared build cache. The same script as a release, every architecture
      # a release has, written as one multi-architecture OCI layout. The
      # registry named here is only a label inside the layout:
      # docker-pr-publish.yml picks the destination.
      - name: Build OCI image layout
        run: |
          ./scripts/build-images.sh --images server \
            --oci-dir "$RUNNER_TEMP/oci" pr-build.invalid
      - uses: actions/upload-artifact@v7
        with:
          name: server-image
          path: ${{ runner.temp }}/oci/server
          compression-level: 0
          # How long a maintainer has to approve the commit before its
          # build must be re-run to publish it.
          retention-days: 7
