name: Build PR Docker Images

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            artifact: image-amd64
          - arch: arm64/v8
            artifact: image-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      # No registry login, secrets, or write token on this runner.
      - name: Build OCI image layout
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_ARCH: linux/${{ matrix.arch }}
        run: |
          docker buildx build \
            --platform "$TARGET_ARCH" \
            --build-arg LATEST_COMMIT_SHA="$HEAD_SHA" \
            --build-arg TARGET_ARCH="$TARGET_ARCH" \
            -f ./docker/Dockerfile \
            --output "type=oci,tar=false,dest=$RUNNER_TEMP/image" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/image
          compression-level: 0
          retention-days: 3
