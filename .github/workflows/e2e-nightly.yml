name: E2E (nightly)

# The full end-to-end suite builds the server and worker images and exercises
# them against the real AUR and Arch mirrors. That makes it slow (~15 min) and
# flaky in ways no diff can fix, so it runs once a night instead of on every
# push -- and only when something actually landed since the last slot.
#
# To run it on a pull request on demand, add the `run-e2e` label; a job of its
# own takes it off once the run is over, pass or fail, so re-adding it re-runs
# the suite.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  e2eTest:
    # Scheduled and manual runs always go ahead; a PR run only when the label
    # that was just added is the trigger one.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-e2e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The e2e suite builds the images, which read the PKGBUILDs from the
          # AUR submodules under packaging/.
          submodules: recursive
          # The suite builds and runs code from the tree under test; nothing
          # in it needs to push.
          persist-credentials: false

      - name: Check for new commits
        id: changed
        run: |
          # Scheduled runs fire even when nothing landed, so they only go ahead
          # when HEAD is newer than the last slot (24h plus slack for queue
          # delays). A manual or label-triggered run always goes ahead.
          if [ "${{ github.event_name }}" = "schedule" ] \
            && [ "$(git log -1 --format=%ct)" -lt "$(($(date +%s) - 90000))" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No commits in the last 25h; skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker
        if: steps.changed.outputs.run == 'true'
        uses: docker/setup-docker-action@v5

      - name: Set up Docker Buildx
        if: steps.changed.outputs.run == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Run E2E test
        if: steps.changed.outputs.run == 'true'
        run: ./scripts/test-e2e.sh hello

  # Take the label off after the run, pass or fail, so that adding it again
  # re-runs the suite. A job of its own, so the token that can edit the PR
  # never shares a job with the tree's code. Fork PRs get a read-only token,
  # so there the label stays.
  removeLabel:
    needs: e2eTest
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'run-e2e'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove the trigger label
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # The REST call needs only the pull-requests permission above.
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/run-e2e"
