name: Clean up PR Docker Images

# Deletes preview images (see PR-IMAGES.md) whose PR has closed, and any older
# than 30 days. Never checks out or runs anything: GitHub's API says what
# exists and which PRs are open, and skopeo reads the images' manifests.
on:
  pull_request_target:
    branches: [master]
    types: [closed]
  # Catches what a close missed: a publish that finished after its PR closed,
  # a failed run, and expiry.
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions: {}

# Every run sweeps the whole package, so a queued one replacing another loses
# nothing.
concurrency:
  group: pr-image-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write # list and delete the package's versions
      pull-requests: read # which PRs are still open
    steps:
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      # A multi-architecture image is several package versions: the tagged
      # index, and one untagged version per platform image and attestation
      # it lists. Deleting the index leaves those behind, so they are found
      # through the index's manifest and deleted with it, unless another
      # image still lists them. Untagged versions no image lists (left by a
      # re-published tag, or by a failed cleanup) go once a day old: younger,
      # they may belong to a push still in progress.
      - name: Delete stale preview images
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.repository_owner }}
          MAX_AGE_DAYS: '30'
        with:
          script: |
            const { owner, repo } = context.repo;
            const day = 24 * 60 * 60 * 1000;
            const maxAge = Number(process.env.MAX_AGE_DAYS) * day;
            const now = Date.now();
            const packageName = `${repo.toLowerCase()}-preview`;
            const image = `ghcr.io/${owner.toLowerCase()}/${packageName}`;
            const digestPattern = /^sha256:[0-9a-f]{64}$/;
            const tagPattern = /^pr-([0-9]+)-[0-9a-f]{40}$/;

            const { data: { owner: { type } } } = await github.rest.repos.get({ owner, repo });
            const byOrg = type === 'Organization';
            const packageArgs = {
              package_type: 'container', package_name: packageName,
              ...(byOrg ? { org: owner } : { username: owner })
            };
            const packages = github.rest.packages;
            let versions;
            try {
              versions = await github.paginate(byOrg
                ? packages.getAllPackageVersionsForPackageOwnedByOrg
                : packages.getAllPackageVersionsForPackageOwnedByUser,
                { ...packageArgs, per_page: 100 });
            } catch (error) {
              if (error.status === 404) {
                core.info(`No ${packageName} package yet`);
                return;
              }
              throw error;
            }

            const open = new Map();
            const isOpen = async number => {
              if (!open.has(number)) {
                try {
                  const { data: pr } = await github.rest.pulls.get({
                    owner, repo, pull_number: number
                  });
                  open.set(number, pr.state === 'open');
                } catch (error) {
                  if (error.status !== 404) throw error;
                  open.set(number, false);
                }
              }
              return open.get(number);
            };

            // A tagged version stays while any of its tags is fresh and of
            // an open PR, or is not a preview tag at all.
            const kept = [];
            const stale = [];
            const untagged = [];
            for (const version of versions) {
              if (!digestPattern.test(version.name)) continue;
              const tags = version.metadata?.container?.tags ?? [];
              if (tags.length === 0) {
                untagged.push(version);
                continue;
              }
              const fresh = now - Date.parse(version.updated_at) < maxAge;
              let keep = false;
              for (const tag of tags) {
                const match = tagPattern.exec(tag);
                if (!match || (fresh && await isOpen(Number(match[1])))) {
                  keep = true;
                  break;
                }
              }
              (keep ? kept : stale).push(version);
            }

            const authfile = `${process.env.RUNNER_TEMP}/registry-auth.json`;
            await exec.exec('skopeo', ['login', '--authfile', authfile,
              '--username', process.env.REGISTRY_USER, '--password-stdin', 'ghcr.io'],
              { input: Buffer.from(process.env.REGISTRY_TOKEN) });
            // The versions an index lists. Its manifest was written by PR
            // code, so only well-formed digests are taken from it, and only
            // ever matched against this package's own versions.
            const listed = async version => {
              const { stdout } = await exec.getExecOutput('skopeo', ['inspect', '--raw',
                '--authfile', authfile, `docker://${image}@${version.name}`], { silent: true });
              const manifest = JSON.parse(stdout);
              return (manifest.manifests ?? [])
                .map(entry => entry.digest)
                .filter(digest => typeof digest === 'string' && digestPattern.test(digest));
            };

            const doomed = [...stale];
            // Without every kept index's list, an untagged version might be
            // one of its platforms: leave them all for the next run.
            let referenced = new Set(kept.map(version => version.name));
            try {
              for (const version of kept) {
                for (const digest of await listed(version)) referenced.add(digest);
              }
            } catch (error) {
              core.warning(`Could not read a kept image's manifest; untagged versions stay: ${error.message}`);
              referenced = null;
            }
            if (referenced) {
              const orphaned = new Set();
              for (const version of stale) {
                try {
                  for (const digest of await listed(version)) orphaned.add(digest);
                } catch (error) {
                  core.warning(`Could not read ${version.name}; its platforms go once a day old`);
                }
              }
              for (const version of untagged) {
                if (referenced.has(version.name)) continue;
                if (orphaned.has(version.name) || now - Date.parse(version.updated_at) > day) {
                  doomed.push(version);
                }
              }
            }

            let deleted = 0;
            for (const version of doomed) {
              const tags = version.metadata?.container?.tags ?? [];
              try {
                await (byOrg ? packages.deletePackageVersionForOrg : packages.deletePackageVersionForUser)(
                  { ...packageArgs, package_version_id: version.id });
                core.info(`Deleted ${version.name} ${tags.join(' ')}`);
                deleted += 1;
              } catch (error) {
                // GHCR refuses to delete a package's last version.
                core.warning(`Could not delete ${version.name} ${tags.join(' ')}: ${error.message}`);
              }
            }
            core.summary.addRaw(`Deleted ${deleted} of ${versions.length} preview package versions.`);
            await core.summary.write();
