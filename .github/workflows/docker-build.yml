name: Build and Push Docker Images

# Publishes the backend-only image as `aurcache-server`. The `aurcache`
# name is reserved for the hybrid (server + embedded worker) compatibility
# image, so existing single-container compose files keep working when they
# pull `aurcache:latest`. New setups use `aurcache-server` + `aurcache-worker`.

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # packaging/ holds AUR submodules; the image builds read the
          # PKGBUILDs from them.
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "tag=git" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Build server with the local publishing script
        if: steps.vars.outputs.tag != 'unknown'
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          args=(--images server --tag "$IMAGE_TAG")
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then args+=(--push); fi
          ./scripts/build-images.sh "${args[@]}" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"

      - name: Tag the multi-platform release as latest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aurcache-server"
          docker buildx imagetools create "$image:$IMAGE_TAG" --tag "$image:latest"
