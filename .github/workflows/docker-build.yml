name: Build and Push Docker Images

# Publishes the backend-only image as `aurcache-server`. The `aurcache`
# name is reserved for the hybrid (server + embedded worker) compatibility
# image, so existing single-container compose files keep working when they
# pull `aurcache:latest`. New setups use `aurcache-server` + `aurcache-worker`.

on:
  push:
    branches:
      - master
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # packaging/ holds AUR submodules; the image builds read the
          # PKGBUILDs from them.
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "tag=git" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=unknown" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests build in docker-pr-build.yml, which holds no registry
      # credentials. A release is `latest` as well.
      - name: Build server with the local publishing script
        if: steps.vars.outputs.tag != 'unknown'
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          args=(--images server --push --tag "$IMAGE_TAG")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args+=(--tag latest); fi
          ./scripts/build-images.sh "${args[@]}" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
