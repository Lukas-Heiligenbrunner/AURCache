name: Build and Push Docker Images

# Publishes the backend-only image as `aurcache-server`. The `aurcache`
# name is reserved for the hybrid (server + embedded worker) compatibility
# image, so existing single-container compose files keep working when they
# pull `aurcache:latest`. New setups use `aurcache-server` + `aurcache-worker`.

on:
  push:
    branches:
      - master
    tags:
      - '*'
      # A CLI release tag is release-binaries.yml's alone: until the images
      # are split per component, any other tag releases them all as `latest`.
      # GitHub applies the patterns in order and the last match wins, so the
      # exclusion has to come after '*'.
      - '!aurcache-cli-v*'
  # A pull request labelled `preview-image` publishes `pr-<number>`, and every
  # later push to it does too.
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # A fork's pull request gets a read-only token, so it cannot push: to
    # preview one, push its head to a branch here and open a PR from that.
    # Adding any other label would otherwise republish the same commit.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'preview-image') &&
       (github.event.action != 'labeled' || github.event.label.name == 'preview-image'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          # packaging/ holds AUR submodules; the image builds read the
          # PKGBUILDs from them.
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: vars
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            echo "tag=git" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Build server with the local publishing script
        if: steps.vars.outputs.tag != 'unknown'
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          args=(--images server --tag "$IMAGE_TAG")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args+=(--tag latest); fi
          ./scripts/build-images.sh --push "${args[@]}" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
