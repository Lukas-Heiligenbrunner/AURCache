# Podman inside the hybrid image's container (DinD mode).
#
# Adapted from upstream's `quay.io/podman/stable` base, which is built to run
# podman nested, and nothing assumes a systemd manager. The outer container
# being privileged is what makes this work, as it always was.
#
# Build containers share only the namespaces nesting needs: the user namespace
# (there are no subuids to map), the network (so the repository URL's
# `localhost` is this container's, where the server listens) and the cgroup
# namespace (so resource limits apply). The base image also shared IPC and the
# hostname; a build needs neither, so each gets its own.
[containers]
netns = "host"
userns = "host"
cgroupns = "host"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
