# Podman's image store inside the hybrid image (DinD mode).
#
# The store lives in a volume (`/var/lib/containers`, declared by the image),
# so it does not sit on the outer container's own overlay filesystem, which
# overlay cannot be stacked on. fuse-overlayfs mounts the layers, as in
# upstream's image -- the reason its documented requirements included fuse.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
mountopt = "nodev,fsync=0"
