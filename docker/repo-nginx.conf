# Static file server for the pacman repository.
#
# Mounted into the `repo` service in docker-compose.yaml, which publishes it
# on the mirror port (8081) instead of Rocket's builtin file handler. Same
# bytes, a fraction of the CPU: nginx serves archives with sendfile while
# Rocket streams them through userspace in 4 KiB chunks.
#
# Rocket's builtin handler stays in the binary and keeps listening on 8081
# inside the `aurcache` container -- it is simply not published here. Simple
# deployments (bare metal, `just serve`, the e2e suite) still use it.
server {
    listen 80;
    root /app/repo;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # Mirror CustomFileServer's no-dot-segments rule: `.staging` uploads and
    # artifacts mid-publish live under this root and are nobody's to download.
    location ~ /\. {
        return 404;
    }
}
