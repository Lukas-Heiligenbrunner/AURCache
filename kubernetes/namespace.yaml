apiVersion: v1
kind: Namespace
metadata:
  name: aurcache
  labels:
    # Pod Security Admission. The build worker builds every package in a
    # systemd-nspawn chroot, which needs a privileged pod; `baseline` or
    # `restricted` would refuse to create it. The server alone would pass
    # `baseline`, so a cluster that wants that can give the workers a
    # namespace of their own.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
