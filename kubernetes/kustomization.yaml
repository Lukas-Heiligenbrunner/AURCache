# =============================================================================
# AURCache on Kubernetes
# =============================================================================
# The server (web UI, API, pacman repository) and the workers that build for
# it, in the `aurcache` namespace:
#
#     kubectl apply -k kubernetes/
#
# Then, from your machine:
#
#     kubectl -n aurcache port-forward svc/aurcache 8080:8080 8081:8081
#
# Web UI / API : http://localhost:8080   (plain HTTP; put an Ingress in front for TLS)
# Pacman repo  : http://localhost:8081   (add as a [repo] Server in pacman.conf)
#
# The server is the base (server/, which also applies on its own). The workers
# are a choice, below. By default that is one x86_64 chroot worker: a
# privileged pod that needs Linux 6.7 or newer with btrfs on its node, and a
# disk for its storage pool. See the Kubernetes page of the documentation
# before running it on a cluster you share with anything else.
#
# A new worker shows up on the Workers page as pending: approve it there, or
# create the `aurcache-enrollment` Secret below before applying and it is
# approved on its own.
#
# `kubectl delete -k kubernetes/` deletes the namespace, and with it the
# server's volume -- the database, the repository and the worker CA -- unless
# its PersistentVolume is set to be retained. See "Removing it" in the docs.
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` here: everything below names its own, and a worker kind may
# span more than one.

labels:
  - pairs:
      app.kubernetes.io/part-of: aurcache
    includeTemplates: true

resources:
  - server

# The workers. Each component adds one kind, and they can be combined.
components:
  # Chroot workers on amd64 nodes, building x86_64 packages, each in a clean
  # devtools chroot. Privileged: this also raises the namespace's Pod Security
  # level to `privileged`. Comment it out for the server alone.
  - components/chroot-workers
  #
  # The same on arm64 nodes, building aarch64 packages.
  # - components/chroot-workers-arm64
  #
  # Options for the chroot workers, listed after them:
  #
  # Their storage pools in an image file on their data volume, for a storage
  # class that cannot provision `volumeMode: Block` (local-path, for one).
  # Read the component first: such a class may not enforce sizes.
  # - components/pool-image
  #
  # An egress NetworkPolicy keeping their builds off the cluster's private
  # network. Read the component first: it has to match your cluster's DNS.
  # - components/chroot-worker-egress
  #
  # The server's database in PostgreSQL instead of SQLite. It expects an
  # `aurcache-postgres` Secret; see the component.
  # - components/postgres

# Image versions. The manifests name `git`, built from master, until a
# release after 0.6.0 is out: 0.6.0's worker image hands the node's root
# cgroup to its own user when it runs privileged under containerd. Once that
# release exists, pin it here (and keep server and workers on one version):
#
#     kustomize edit set image \
#       ghcr.io/lukas-heiligenbrunner/aurcache-server:<version> \
#       ghcr.io/lukas-heiligenbrunner/aurcache-worker:<version>
#
# images:
#   - name: ghcr.io/lukas-heiligenbrunner/aurcache-server
#     newTag: "<version>"
#   - name: ghcr.io/lukas-heiligenbrunner/aurcache-worker
#     newTag: "<version>"

# Automatic approval of workers (optional). The server approves a new worker
# that presents the same token; without the Secret nothing is approved until
# someone clicks Approve on the Workers page. Kept out of this directory so no
# token is ever committed with it:
#
#     kubectl apply -f kubernetes/server/namespace.yaml
#     kubectl -n aurcache create secret generic aurcache-enrollment \
#       --from-literal=token="$(openssl rand -hex 32)"
