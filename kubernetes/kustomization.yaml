# =============================================================================
# AURCache on Kubernetes
# =============================================================================
# The server (web UI, API, pacman repository) and one x86_64 chroot build
# worker, in their own namespace:
#
#     kubectl apply -k kubernetes/
#
# Then, from your machine:
#
#     kubectl -n aurcache port-forward svc/aurcache 8080:8080 8081:8081
#
# Web UI / API : http://localhost:8080   (plain HTTP; put an Ingress in front for TLS)
# Pacman repo  : http://localhost:8081   (add as a [repo] Server in pacman.conf)
#
# The worker shows up on the Workers page as pending: approve it there, or
# create the `aurcache-enrollment` Secret below before applying and it is
# approved on its own.
#
# The worker needs what it needs under Docker: a privileged pod, Linux 6.7 or
# newer with btrfs on its node, and a disk for its storage pool. See the
# Kubernetes page of the documentation before running this on a cluster you
# share with anything else.
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything goes in here. Changing it means changing the namespace in the
# server's AURCACHE_TLS_SANS too (server/server.yaml).
namespace: aurcache

labels:
  - pairs:
      app.kubernetes.io/part-of: aurcache

resources:
  - namespace.yaml
  - server
  - worker
  # A second set of workers on arm64 nodes, building aarch64 packages. A chroot
  # worker builds for the architecture it runs on, so each architecture is its
  # own StatefulSet pinned to nodes of that architecture.
  # - worker-arm64

components:
  # Uncomment to keep the workers' storage pools in an image file on their data
  # volume rather than on a raw block volume of their own: for a storage class
  # that cannot provision `volumeMode: Block` (local-path, for one).
  # - components/pool-image
  #
  # Uncomment to keep the database in PostgreSQL instead of SQLite. It expects
  # an `aurcache-postgres` Secret; see the component.
  # - components/postgres

# Pin a release instead of following `latest`:
#
#     kustomize edit set image \
#       ghcr.io/lukas-heiligenbrunner/aurcache-server:<version> \
#       ghcr.io/lukas-heiligenbrunner/aurcache-worker:<version>
#
# images:
#   - name: ghcr.io/lukas-heiligenbrunner/aurcache-server
#     newTag: "<version>"
#   - name: ghcr.io/lukas-heiligenbrunner/aurcache-worker
#     newTag: "<version>"

# Automatic approval of workers (optional). The server approves a new worker
# that presents the same token; without the Secret nothing is approved until
# someone clicks Approve on the Workers page. Kept out of this directory so no
# token is ever committed with it:
#
#     kubectl create namespace aurcache
#     kubectl -n aurcache create secret generic aurcache-enrollment \
#       --from-literal=token="$(openssl rand -hex 32)"
