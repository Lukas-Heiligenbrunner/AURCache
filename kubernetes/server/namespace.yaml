apiVersion: v1
kind: Namespace
metadata:
  name: aurcache
  labels:
    # Pod Security Admission. The server runs as root with the default
    # capabilities, which `baseline` allows. The chroot workers need
    # privileged pods: components/chroot-workers raises this to `privileged`
    # when it adds them.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
