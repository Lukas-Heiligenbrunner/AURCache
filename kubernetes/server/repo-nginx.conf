# The pacman repository, served statically from the server's data volume. Dot
# segments are refused: names starting with a dot under the repository hold
# what is not for clients, such as uploads mid-publish (`.staging`).
server {
  listen 80;
  root /app/repo;
  sendfile on;
  tcp_nopush on;
  server_tokens off;
  location ~ /\. { return 404; }
}
