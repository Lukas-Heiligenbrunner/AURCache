# An optional ceiling on all builds together, which the dispatcher honours: it
# does not claim a build the namespace has no room for. Not part of the default
# set; enable it in kustomization.yaml and change the numbers.
#
# A quota on CPU or memory makes the cluster refuse any pod with a container
# that does not state it, so list only what builds are given: `requests.cpu`
# and `requests.memory` (and `limits.*`) need the per-build limits set on the
# worker (WORKER_BUILD_CPUS, WORKER_BUILD_MEMORY_MAX). One on
# `requests.ephemeral-storage` refuses no pod, but counts a container that
# does not state it as asking for none, so it limits nothing without the
# worker's disk limit (WORKER_BUILD_DISK_MAX). A pod count needs nothing.
#
# Beside the build, each pod asks for 10m of CPU and 16Mi of memory (limits:
# one CPU, 64Mi) for the container that hands the packages back, and so does
# the pod of the NetworkPolicy check.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aurcache-builds
  namespace: aurcache-builds
  labels:
    app.kubernetes.io/name: aurcache-builds
    app.kubernetes.io/component: kube-worker
spec:
  hard:
    # Builds running at once. `pods` counts the pods that have not ended;
    # `count/pods` would count every pod object, one that failed and was not
    # yet deleted included. The NetworkPolicy check's pod takes one too, for
    # about half a minute each time the dispatcher starts.
    pods: "8"
    # requests.cpu: "32"
    # requests.memory: 64Gi
    # requests.ephemeral-storage: 400Gi
