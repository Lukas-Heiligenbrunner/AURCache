# An optional ceiling on all builds together, which the dispatcher honours: it
# does not claim a build the namespace has no room for. Not part of the default
# set; enable it in kustomization.yaml and change the numbers.
#
# A quota on a resource makes the cluster refuse any pod that does not state
# it, so list only what builds are given: `requests.cpu` and `requests.memory`
# need the per-build limits set on the worker (WORKER_BUILD_CPUS,
# WORKER_BUILD_MEMORY_MAX), and `requests.ephemeral-storage` its disk limit
# (WORKER_BUILD_DISK_MAX). A pod count needs nothing.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aurcache-builds
  namespace: aurcache-builds
  labels:
    app.kubernetes.io/name: aurcache-builds
    app.kubernetes.io/component: kube-worker
spec:
  hard:
    # Builds running at once.
    count/pods: "8"
    # requests.cpu: "32"
    # requests.memory: 64Gi
    # requests.ephemeral-storage: 400Gi
